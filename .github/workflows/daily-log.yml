name: Daily Activity Log

on:
  workflow_dispatch:
  schedule:
    - cron: "47 0 * * *"   # 07:47 WIB - utama (biasanya jalan ~08:00 karena antrean)
    - cron: "23 3 * * *"   # 10:23 WIB - cadangan 1
    - cron: "11 7 * * *"   # 14:11 WIB - cadangan 2

permissions:
  contents: write

concurrency:
  group: daily-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set git identity
        run: |
          git config user.name "Setya Pramudiya Hakim"
          git config user.email "setyapramudiya18@gmail.com"

      - name: Append activity log (maks. 1x per hari untuk jadwal)
        id: log
        run: |
          TODAY=$(TZ=Asia/Jakarta date +'%Y-%m-%d')
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ] && grep -q "^Update $TODAY " activity_log.txt 2>/dev/null; then
            echo "Log hari ini sudah ada, skip."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Update $(TZ=Asia/Jakarta date +'%Y-%m-%d %H:%M:%S') WIB" >> activity_log.txt
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit & Push
        if: steps.log.outputs.skip == 'false'
        run: |
          git add activity_log.txt
          git commit -m "chore: daily activity log ${{ steps.log.outputs.today }}"
          git pull --rebase
          git push
